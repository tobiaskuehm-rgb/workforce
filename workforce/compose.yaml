# One service, one volume, one config, secrets as files. `docker compose up -d`.
services:
  workforce:
    build: .
    image: workforce:v1
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - workforce-state:/var/lib/workforce
      - ./config.json:/etc/workforce/config.json:ro
      - ./skills:/etc/workforce/skills:ro
    secrets:
      - telegram_bot_token
      - anthropic_api_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
secrets:
  # Host files: chgrp 10001, chmod 640 - the container user reads by number (G-044).
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
volumes:
  workforce-state:
