name: startup

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - startup.env
    volumes:
      - workforce_database_v1:/var/lib/postgresql/data
      # postgres-init is deliberately NOT mounted at
      # /docker-entrypoint-initdb.d (review finding G-041). The official
      # postgres entrypoint runs every *.sql it finds there, alphabetically,
      # whenever the data directory is empty - before registry-migrate exists
      # and with no knowledge of its gates. The folder holds 001-008; on a
      # restore that would apply Knowledge 004 as a side effect and then abort
      # at 007, whose roles do not exist yet, leaving a half-built database.
      #
      # registry-migrate mounts the same folder at /opt/startup/migrations and
      # applies 001-003 itself when the marker table is missing, so nothing is
      # lost by removing this line - only the path that ignores the gates.
      - ./postgres-tests:/opt/startup/tests:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  registry-migrate:
    image: postgres:17-alpine
    restart: "no"
    env_file:
      - startup.env
    environment:
      # Fail-closed gates for the two migrations that are not yet approved
      # (review finding G-031). Flip exactly one, for exactly one window, and
      # set it back afterwards. Migrations 001-003 stay automatic: they are
      # long applied and the marker check makes re-running them a no-op.
      APPLY_MIGRATION_004_KNOWLEDGE: "false"
      APPLY_MIGRATION_005_BUS_DENIAL_AUDIT: "false"
      # 006 is a no-op on the running NAS - the tables exist since August. It
      # only records that their definition moved out of the API startup path.
      APPLY_MIGRATION_006_LEGACY_TABLES: "false"
      # 007 needs workforce_api and workforce_backup to exist first - it
      # refuses otherwise, because a login role means a password and a
      # password does not belong in a versioned file.
      APPLY_MIGRATION_007_LEAST_PRIVILEGE: "false"
      # Belongs with 004: without the knowledge migration there is nothing to
      # grant. Never open this one alone.
      APPLY_MIGRATION_008_KNOWLEDGE_GRANTS: "false"
      # G-045: verschiebt das Eigentum der SECURITY-DEFINER-Funktionen auf
      # workforce_owner, damit kein Busaufruf mehr als Superuser laeuft. Eigenes
      # Fenster, eigene Freigabe - ein Fehlgriff bei den Rechten legt den Bus
      # still. Bleibt zu, bis diese Entscheidung getroffen ist.
      APPLY_MIGRATION_009_FUNCTION_OWNER: "false"
      # SV-2026-09-03-04: der benannte Rueckbau zu 009. Gehoert in dasselbe
      # Fenster wie 009 - aber als eigener Aufruf, damit ein Rueckbau eine
      # Entscheidung bleibt und keine Nebenwirkung. Ohne angewendetes 009
      # bricht die Migration von selbst ab.
      APPLY_MIGRATION_010_FUNCTION_OWNER_ROLLBACK: "false"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${POSTGRES_USER:?startup.env lacks POSTGRES_USER}"
        : "$${POSTGRES_DB:?startup.env lacks POSTGRES_DB}"
        : "$${POSTGRES_PASSWORD:?startup.env lacks POSTGRES_PASSWORD}"
        export PGHOST="db"
        export PGUSER="$$POSTGRES_USER"
        export PGDATABASE="$$POSTGRES_DB"
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        migration_table="$$(psql -tAc "SELECT to_regclass('workforce.schema_migrations')")"
        if [ "$$migration_table" != "workforce.schema_migrations" ]; then
          psql -v ON_ERROR_STOP=1 -f /opt/startup/migrations/001_employee_registry.sql
          echo "Employee Registry migration applied."
        else
          registry_count="$$(psql -tAc "SELECT count(*) FROM workforce.schema_migrations WHERE migration_id = '001_employee_registry'")"
          if [ "$$registry_count" != "1" ]; then
            echo "Registry schema exists without migration marker; refusing to continue."
            exit 1
          fi
          echo "Employee Registry migration already applied."
        fi
        bus_count="$$(psql -tAc "SELECT count(*) FROM workforce.schema_migrations WHERE migration_id = '002_workforce_bus'")"
        if [ "$$bus_count" = "0" ]; then
          psql -v ON_ERROR_STOP=1 -f /opt/startup/migrations/002_workforce_bus.sql
          echo "Workforce Bus migration applied; channel remains DISABLED."
        elif [ "$$bus_count" = "1" ]; then
          echo "Workforce Bus migration already applied."
        else
          echo "Unexpected Workforce Bus migration marker count; refusing to continue."
          exit 1
        fi
        trigger_fix_count="$$(psql -tAc "SELECT count(*) FROM workforce.schema_migrations WHERE migration_id = '003_workforce_bus_trigger_fix'")"
        if [ "$$trigger_fix_count" = "0" ]; then
          psql -v ON_ERROR_STOP=1 -f /opt/startup/migrations/003_workforce_bus_trigger_fix.sql
          echo "Workforce Bus credential trigger fix applied."
        elif [ "$$trigger_fix_count" = "1" ]; then
          echo "Workforce Bus credential trigger fix already applied."
        else
          echo "Unexpected Workforce Bus trigger fix marker count; refusing to continue."
          exit 1
        fi
        # Migrations 004 and 005 belong to different gates and are therefore
        # opt-in, fail-closed (review finding G-031). Without an explicit
        # APPLY_..., a routine `docker compose up` applies neither. Knowledge
        # has its own approval; a core-audit window must not migrate it as a
        # side effect, and vice versa.
        knowledge_count="$$(psql -tAc "SELECT count(*) FROM workforce.schema_migrations WHERE migration_id = '004_knowledge_capability'")"
        if [ "$$knowledge_count" = "0" ] && [ "$${APPLY_MIGRATION_004_KNOWLEDGE:-false}" != "true" ]; then
          echo "Knowledge & Capability migration NOT applied: gate closed (APPLY_MIGRATION_004_KNOWLEDGE is not true)."
        elif [ "$$knowledge_count" = "0" ]; then
          psql -v ON_ERROR_STOP=1 -f /opt/startup/migrations/004_knowledge_capability.sql
          echo "Knowledge & Capability migration applied; system remains DISABLED."
        elif [ "$$knowledge_count" = "1" ]; then
          echo "Knowledge & Capability migration already applied."
        else
          echo "Unexpected Knowledge & Capability migration marker count; refusing to continue."
          exit 1
        fi
        denial_audit_count="$$(psql -tAc "SELECT count(*) FROM workforce.schema_migrations WHERE migration_id = '005_bus_denial_audit'")"
        if [ "$$denial_audit_count" = "0" ] && [ "$${APPLY_MIGRATION_005_BUS_DENIAL_AUDIT:-false}" != "true" ]; then
          echo "Workforce Bus denial audit NOT applied: gate closed (APPLY_MIGRATION_005_BUS_DENIAL_AUDIT is not true)."
        elif [ "$$denial_audit_count" = "0" ]; then
          psql -v ON_ERROR_STOP=1 -f /opt/startup/migrations/005_bus_denial_audit.sql
          echo "Workforce Bus denial audit applied."
        elif [ "$$denial_audit_count" = "1" ]; then
          echo "Workforce Bus denial audit already applied."
        else
          echo "Unexpected Workforce Bus denial audit marker count; refusing to continue."
          exit 1
        fi
        legacy_tables_count="$$(psql -tAc "SELECT count(*) FROM workforce.schema_migrations WHERE migration_id = '006_legacy_registry_tables'")"
        if [ "$$legacy_tables_count" = "0" ] && [ "$${APPLY_MIGRATION_006_LEGACY_TABLES:-false}" != "true" ]; then
          echo "Legacy registry tables NOT applied: gate closed (APPLY_MIGRATION_006_LEGACY_TABLES is not true)."
        elif [ "$$legacy_tables_count" = "0" ]; then
          psql -v ON_ERROR_STOP=1 -f /opt/startup/migrations/006_legacy_registry_tables.sql
          echo "Legacy registry tables recorded; definitions now live in the migration."
        elif [ "$$legacy_tables_count" = "1" ]; then
          echo "Legacy registry tables already applied."
        else
          echo "Unexpected legacy registry table marker count; refusing to continue."
          exit 1
        fi
        roles_count="$$(psql -tAc "SELECT count(*) FROM workforce.schema_migrations WHERE migration_id = '007_least_privilege_roles'")"
        if [ "$$roles_count" = "0" ] && [ "$${APPLY_MIGRATION_007_LEAST_PRIVILEGE:-false}" != "true" ]; then
          echo "Least-privilege roles NOT applied: gate closed (APPLY_MIGRATION_007_LEAST_PRIVILEGE is not true)."
        elif [ "$$roles_count" = "0" ]; then
          psql -v ON_ERROR_STOP=1 -f /opt/startup/migrations/007_least_privilege_roles.sql
          echo "Least-privilege roles applied; workforce_app keeps SUPERUSER until a separate step removes it."
        elif [ "$$roles_count" = "1" ]; then
          echo "Least-privilege roles already applied."
        else
          echo "Unexpected least-privilege role marker count; refusing to continue."
          exit 1
        fi
        knowledge_grants_count="$$(psql -tAc "SELECT count(*) FROM workforce.schema_migrations WHERE migration_id = '008_knowledge_api_grants'")"
        if [ "$$knowledge_grants_count" = "0" ] && [ "$${APPLY_MIGRATION_008_KNOWLEDGE_GRANTS:-false}" != "true" ]; then
          echo "Knowledge API grants NOT applied: gate closed (APPLY_MIGRATION_008_KNOWLEDGE_GRANTS is not true)."
        elif [ "$$knowledge_grants_count" = "0" ]; then
          psql -v ON_ERROR_STOP=1 -f /opt/startup/migrations/008_knowledge_api_grants.sql
          echo "Knowledge API grants applied."
        elif [ "$$knowledge_grants_count" = "1" ]; then
          echo "Knowledge API grants already applied."
        else
          echo "Unexpected knowledge API grant marker count; refusing to continue."
          exit 1
        fi
        function_owner_count="$$(psql -tAc "SELECT count(*) FROM workforce.schema_migrations WHERE migration_id = '009_bus_function_owner'")"
        if [ "$$function_owner_count" = "0" ] && [ "$${APPLY_MIGRATION_009_FUNCTION_OWNER:-false}" != "true" ]; then
          echo "Bus function owner NOT applied: gate closed (APPLY_MIGRATION_009_FUNCTION_OWNER is not true)."
        elif [ "$$function_owner_count" = "0" ]; then
          psql -v ON_ERROR_STOP=1 -f /opt/startup/migrations/009_bus_function_owner.sql
          echo "Bus function owner applied."
        elif [ "$$function_owner_count" = "1" ]; then
          echo "Bus function owner already applied."
        else
          echo "Unexpected bus function owner marker count; refusing to continue."
          exit 1
        fi
        function_owner_rollback_count="$$(psql -tAc "SELECT count(*) FROM workforce.schema_migrations WHERE migration_id = '010_bus_function_owner_rollback'")"
        if [ "$$function_owner_rollback_count" = "0" ] && [ "$${APPLY_MIGRATION_010_FUNCTION_OWNER_ROLLBACK:-false}" != "true" ]; then
          echo "Bus function owner rollback NOT applied: gate closed (APPLY_MIGRATION_010_FUNCTION_OWNER_ROLLBACK is not true)."
        elif [ "$$function_owner_rollback_count" = "0" ]; then
          psql -v ON_ERROR_STOP=1 -f /opt/startup/migrations/010_bus_function_owner_rollback.sql
          echo "Bus function owner rollback applied."
        elif [ "$$function_owner_rollback_count" = "1" ]; then
          echo "Bus function owner rollback already applied."
        else
          echo "Unexpected bus function owner rollback marker count; refusing to continue."
          exit 1
        fi
    volumes:
      - ./postgres-init:/opt/startup/migrations:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  workforce-api:
    image: startup-workforce-api:v9
    build:
      context: ./workforce-api
    restart: unless-stopped
    # No env_file (review finding G-035). startup.env carries POSTGRES_USER=
    # workforce_app and that role's superuser password. Loading it put both in
    # the API container, and "app.py does not read them any more" is no
    # protection: a compromised process reads its own environment and connects
    # as the owner, around every grant migration 007 makes.
    #
    # What is left here is either not secret (the database name) or comes from
    # its own file.
    environment:
      DB_HOST: db
      BUS_REQUIRE_HTTPS: "true"
      # Not a secret, and it has to match startup.env. The migration runner
      # still reads that file; only the API no longer does.
      POSTGRES_DB: workforce
      # The API connects as its own least-privilege role, never as the owner.
      # Without both of these it refuses to start - a missing value used to
      # mean "use workforce_app", silently.
      WORKFORCE_DB_USER: workforce_api
      WORKFORCE_DB_PASSWORD_FILE: /run/secrets/workforce_api_db_password
      WORKFORCE_API_KEY_FILE: /run/secrets/workforce_api_key
      # Synology Reverse Proxy reaches the published port through the
      # current startup_frontend bridge gateway. Keep this host-only.
      BUS_TRUSTED_PROXY_CIDRS: "172.20.0.1/32"
    depends_on:
      db:
        condition: service_healthy
      registry-migrate:
        condition: service_completed_successfully
    secrets:
      - workforce_api_db_password
      - workforce_api_key
    ports:
      - "8080:8080"
    networks:
      - backend
      - frontend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  backend:
    internal: true
  frontend:
    # Pinned so the gateway cannot drift away from BUS_TRUSTED_PROXY_CIDRS.
    # Docker hands out bridge subnets in order, so a recreated network could
    # otherwise land elsewhere and every bus call would fail closed with
    # BUS_HTTPS_REQUIRED (security review 2026-08-31, F4).
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  workforce_database_v1:

secrets:
  workforce_api_key:
    # The value that is today WORKFORCE_API_KEY in startup.env. Copied into
    # its own file in the rollout window; startup.env keeps its copy for the
    # migration runner and the database.
    file: ./secrets/workforce_api_key
  workforce_api_db_password:
    # Created in the rollout window, together with the role itself. Not in
    # git, not in startup.env, not in the environment.
    file: ./secrets/workforce_api_db_password
