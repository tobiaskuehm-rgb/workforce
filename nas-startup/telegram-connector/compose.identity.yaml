name: startup-telegram-identity

services:
  telegram-identity-probe:
    image: startup-telegram-ceo-connector:v1
    build:
      context: .
    entrypoint: ["python", "/app/identity_probe.py"]
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
    secrets:
      - telegram_bot_token
    networks:
      - outbound
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  outbound:

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
