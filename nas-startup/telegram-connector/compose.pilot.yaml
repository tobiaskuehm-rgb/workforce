name: startup-telegram-pilot

services:
  telegram-ceo-connector:
    build:
      context: .
    image: startup-telegram-ceo-connector:v1
    restart: "no"
    profiles:
      - telegram-pilot
    env_file:
      - telegram.env
    volumes:
      - telegram_connector_state_v1:/var/lib/startup-telegram
    networks:
      - outbound
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "/app/telegram_connector.py", "--check-config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  outbound:

volumes:
  telegram_connector_state_v1:
