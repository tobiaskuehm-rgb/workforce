name: startup-telegram-preflight2

services:
  telegram-realtest2-preflight:
    image: postgres:17-alpine
    # startup.db.env carries the three database values and nothing else
    # (workforce-agent/derive_db_env_once.sh). These helper containers never
    # need WORKFORCE_API_KEY or the Telegram token, so they no longer receive
    # them (review finding G-017). Values still appear in `docker inspect`
    # here, unchanged - env_file works that way; only the blast radius shrank.
    env_file:
      - ../startup.db.env
    environment:
      DB_HOST: db
    volumes:
      - ./preflight_realtest2_once.sh:/opt/startup-telegram/preflight_realtest2_once.sh:ro
      - ./realtest2_preflight.sql:/opt/startup-telegram/realtest2_preflight.sql:ro
    entrypoint: ["/bin/sh", "/opt/startup-telegram/preflight_realtest2_once.sh"]
    networks:
      - startup_backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  startup_backend:
    external: true
    name: startup_backend
