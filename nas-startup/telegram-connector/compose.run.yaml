name: startup-telegram-run

services:
  telegram-ceo-connector:
    image: startup-telegram-ceo-connector:v1
    build:
      context: .
    restart: "no"
    env_file:
      - telegram-realtest.env
    secrets:
      - telegram_bot_token
      - workforce_bus_token
    volumes:
      - telegram_realtest_state_v1:/var/lib/startup-telegram
    networks:
      - outbound
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "/app/telegram_connector.py", "--check-config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  outbound:

volumes:
  telegram_realtest_state_v1:

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  workforce_bus_token:
    file: ./secrets/workforce_bus_token
