name: startup-bus-realtest-cleanup

services:
  bus-realtest-cleanup:
    image: postgres:17-alpine
    # startup.db.env carries the three database values and nothing else
    # (workforce-agent/derive_db_env_once.sh). These helper containers never
    # need WORKFORCE_API_KEY or the Telegram token, so they no longer receive
    # them (review finding G-017). Values still appear in `docker inspect`
    # here, unchanged - env_file works that way; only the blast radius shrank.
    env_file:
      - ../startup.db.env
    environment:
      DB_HOST: db
      # Must match the value the prepare step used, otherwise this revokes
      # nothing and the run leaves live credentials behind.
      BUS_REALTEST_RUN_SUFFIX: "20260831-F7"
    volumes:
      - ./cleanup_realtest_once.sh:/opt/startup-bus-realtest/cleanup_realtest_once.sh:ro
      - ./bus_realtest_cleanup.sql:/opt/startup-bus-realtest/bus_realtest_cleanup.sql:ro
    entrypoint: ["/bin/sh", "/opt/startup-bus-realtest/cleanup_realtest_once.sh"]
    networks:
      - startup_backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  startup_backend:
    external: true
    name: startup_backend
