name: startup-workforce-agent-identity

# Creates the dedicated agent identity AGENT-ENG-001 (security review A1).
#
# Unlike prepare/cleanup this is a PERMANENT change to the employee registry,
# not a short-lived credential - hence its own file that has to be invoked
# deliberately. Run once.

services:
  agent-identity:
    image: postgres:17-alpine
    environment:
      DB_HOST: db
      # Honest provenance: a chat approval, explicitly not a decision-log
      # entry. To be superseded by a real DEC number once the decision log is
      # available (review finding G-006).
      AGENT_SOURCE_REF: "CEO-CHAT-2026-08-31/PENDING-DEC"
    volumes:
      - ../startup.db.env:/run/startup.db.env:ro
      - ./agent_identity_create.sql:/opt/startup-agent/agent_identity_create.sql:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        # startup.db.env is derived from startup.env and holds nothing but the
        # three database values (derive_db_env_once.sh). Mounting the full
        # startup.env kept WORKFORCE_API_KEY off `docker inspect` but still
        # readable inside the container - the mount limits the environment, not
        # the file system (review findings G-010, G-017).
        export PGHOST="$${DB_HOST:-db}"
        export PGUSER="$$(sed -n 's/^POSTGRES_USER=//p' /run/startup.db.env)"
        export PGDATABASE="$$(sed -n 's/^POSTGRES_DB=//p' /run/startup.db.env)"
        export PGPASSWORD="$$(sed -n 's/^POSTGRES_PASSWORD=//p' /run/startup.db.env)"
        : "$${PGUSER:?startup.db.env lacks POSTGRES_USER}"
        : "$${PGDATABASE:?startup.db.env lacks POSTGRES_DB}"
        : "$${PGPASSWORD:?startup.db.env lacks POSTGRES_PASSWORD}"
        psql -v ON_ERROR_STOP=1 -v source_ref="$$AGENT_SOURCE_REF" -f /opt/startup-agent/agent_identity_create.sql
    networks:
      - startup_backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  startup_backend:
    external: true
    name: startup_backend
