name: startup-workforce-agent-dryrun

# The safe first run: exercises the entire bus path - read inbox, acknowledge,
# reply - with the echo provider. No API key, no external service, no cost, and
# not one byte leaves the NAS. Everything is set inline, so this needs no env
# file either; the only secret is the bus token the prepare step issued.
#
# Still requires the temporary DSM firewall rule for 172.31.254.2/32 on TCP
# 8443, because the agent reaches the workforce API through the reverse proxy.

services:
  agent-dryrun:
    image: startup-workforce-agent:v1
    build:
      context: .
    restart: "no"
    environment:
      AGENT_ENABLED: "true"
      AGENT_KILL_SWITCH: "false"
      AGENT_PROVIDER: "echo"
      # Irrelevant for the echo provider, which never reads the payload, but
      # kept restrictive so a copy of this file cannot widen the boundary by
      # accident.
      AGENT_DATA_POLICY: "METADATA_ONLY"
      AGENT_BUS_BASE_URL: https://192-168-68-78.k30068872219.direct.quickconnect.to:8443
      AGENT_BUS_TOKEN_FILE: /run/secrets/agent_bus_token
      AGENT_POLL_SECONDS: "5"
      # Exactly one pass over the inbox, then the container exits by itself.
      AGENT_MAX_CYCLES: "1"
      # Ceilings apply even to the echo provider, so the dry run exercises
      # the budget path too. Echo costs nothing, hence the zero cost cap.
      AGENT_MAX_MESSAGES: "10"
      AGENT_MAX_PROVIDER_CALLS: "10"
      AGENT_MAX_TOKENS: "100000"
      AGENT_MAX_COST_USD: "0"
      AGENT_MAX_RUNTIME_SECONDS: "300"
    secrets:
      - agent_bus_token
    networks:
      outbound:
        ipv4_address: 172.31.254.2
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  outbound:
    ipam:
      config:
        - subnet: 172.31.254.0/29

secrets:
  agent_bus_token:
    file: ./secrets/agent_bus_token
