name: startup-core-roundtrip-cleanup

services:
  core-cleanup:
    image: postgres:17-alpine
    environment:
      DB_HOST: db
      # Must match the prepare step.
      CORE_RUN_SUFFIX: "20260831-CORE1"
    volumes:
      - ../startup.db.env:/run/startup.db.env:ro
      - ./core_cleanup.sql:/opt/startup-core/core_cleanup.sql:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        # startup.db.env is derived from startup.env and holds nothing but the
        # three database values (derive_db_env_once.sh). Mounting the full
        # startup.env kept WORKFORCE_API_KEY off `docker inspect` but still
        # readable inside the container - the mount limits the environment, not
        # the file system (review findings G-010, G-017).
        export PGHOST="$${DB_HOST:-db}"
        export PGUSER="$$(sed -n 's/^POSTGRES_USER=//p' /run/startup.db.env)"
        export PGDATABASE="$$(sed -n 's/^POSTGRES_DB=//p' /run/startup.db.env)"
        export PGPASSWORD="$$(sed -n 's/^POSTGRES_PASSWORD=//p' /run/startup.db.env)"
        : "$${PGUSER:?startup.db.env lacks POSTGRES_USER}"
        : "$${PGDATABASE:?startup.db.env lacks POSTGRES_DB}"
        : "$${PGPASSWORD:?startup.db.env lacks POSTGRES_PASSWORD}"
        psql -v ON_ERROR_STOP=1 -v run_suffix="$$CORE_RUN_SUFFIX" -f /opt/startup-core/core_cleanup.sql
        echo "Reminder: delete ./secrets/core_token_* by hand now that the credentials are revoked."
    networks:
      - startup_backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  startup_backend:
    external: true
    name: startup_backend
